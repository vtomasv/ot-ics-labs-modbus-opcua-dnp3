name: Docker Compose lab verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lab:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable amd64 container emulation on ARM64
        if: matrix.runner == 'ubuntu-24.04-arm'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64
      - name: Check Compose version and configuration
        run: |
          docker compose version
          docker compose config --quiet
          test "$(docker compose config --format json | jq -r '.services.plant.platform')" = linux/amd64
          test "$(docker compose config --format json | jq -r '.services.trainer.platform')" = linux/amd64
          test "$(docker compose config --format json | jq -r '.services.dnp3.platform')" = linux/amd64
          test "$(docker compose config --format json | jq -r '.services.sensor.platform')" = linux/amd64
      - name: Verify all thirteen screenshots against their SHA-256 manifest
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('docs/capturas/manifest.json').read_text())
          assert len(manifest['files']) == 13
          for item in manifest['files']:
              assert item['file'].startswith('docs/') and item['file'].endswith('.png')
              content = Path(item['file']).read_bytes()
              assert len(content) == item['bytes']
              assert hashlib.sha256(content).hexdigest() == item['sha256'], item['file']
          print('13/13 capturas íntegras')
          PY
      - name: Build and start the isolated plant
        run: docker compose up -d
      - name: Verify all four protocol scenarios and IDS
        run: bash scripts/verify-lab.sh
      - name: Verify four guided workspaces, capture and allowlists
        run: python3 scripts/verify-workspaces.py
      - name: Unit tests for twin and PCAP dissection
        run: docker compose exec -T plant python -m unittest discover -s app/tests
      - name: Verify DNP3 outstation and master framing
        run: |
          docker compose exec -T dnp3 python /lab/dnp3/smoke.py
          docker compose exec -T plant python /lab/dnp3/test_native_unit.py
      - name: Stop services without deleting evidence
        if: always()
        run: |
          docker compose logs --tail=80 plant trainer dnp3 suricata sensor || true
          docker compose down || true
